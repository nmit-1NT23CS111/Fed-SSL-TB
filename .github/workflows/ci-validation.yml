name: CI Validation

on:
  pull_request:
    branches: [architecture-fix]
  push:
    branches: [architecture-fix, ci-validation-20261007]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check
        run: python -m compileall -q src *.py

      - name: Unit and regression tests
        run: python -m pytest -q

      - name: Smoke test
        run: python test_smoke.py
