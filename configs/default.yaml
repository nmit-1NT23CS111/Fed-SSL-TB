data:
  nih_path: "data/raw/NIH"
  shenzhen_path: "data/raw/Shenzhen"
  montgomery_path: "data/raw/Montgomery"
  processed_dir: "data/processed"
  image_size: 224
  num_hospitals: 10
  split_strategy: non_iid
  split_alpha: 1.0

model:
  backbone: "vit_tiny"
  embed_dim: 192
  mask_ratio: 0.80
  decoder_depth: 4

ssl:
  epochs_per_round: 2
  batch_size: 16
  lr: 1.0e-3

federated:
  rounds: 20
  aggregation: fedprox
  fedprox_mu: 0.01
  min_client_samples: 500

few_shot:
  shots_per_class: 50
  train_queries_per_class: 50
  seed: 42

loss:
  lambda_mae: 0.70
  lambda_proto: 0.30

logging:
  log_dir: experiments/logs/
  checkpoint_dir: experiments/checkpoints/